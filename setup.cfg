[metadata]
name = dupeGuru
version = attr: core.__version__
url = https://github.com/usermo7amed/dupeguru-fedora
project_urls =
    Bug Reports = https://github.com/usermo7amed/dupeguru-fedora/issues
author = Andrew Senetar
author_email = arsenetar@voltaicideas.net
license = GPLv3
license_files = license
description = dupeGuru is a tool to find duplicate files on Linux.
long_description = file:README.md
long_description_content_type = text/markdown
classifiers =
    Development Status :: 5 - Production/Stable
    Intended Audience :: End Users/Desktop
    License :: OSI Approved :: GNU General Public License v3 (GPLv3)
    Operating System :: POSIX
    Programming Language :: Python :: 3 :: Only
    Topic :: Desktop Environment :: File Managers

[options]
packages = find:
python_requires = >=3.7
install_requires =
    Send2Trash>=1.8.2,<2.0.0
    mutagen>=1.46.0,<2.0.0
    distro>=1.8.0,<2.0.0
    semantic-version>=2.0.0,<3.0.0
    xxhash>=3.0.0,<4.0.0
setup_requires =
    sphinx>=5.3.0,<8.0.0
    polib>=1.1.0,<2.0.0
include_package_data = true
