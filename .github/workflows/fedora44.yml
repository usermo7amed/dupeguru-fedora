name: Fedora 44 GNOME build and RPM

on:
  push:
    branches:
      - fedora44-ci-packaging
      - fedora44-gnome-rpm
      - fedora44-runtime-smoke
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    steps:
      - name: Install Fedora build dependencies
        run: |
          dnf -y upgrade --refresh
          dnf -y install \
            git make gcc gcc-c++ python3 python3-devel python3-pip \
            python3-setuptools python3-pytest python3-sphinx python3-polib \
            python3-distro python3-mutagen python3-semantic_version \
            python3-send2trash python3-xxhash \
            python3-qt5 python3-qt5-devel qt5-qttools-devel \
            gettext rpm-build desktop-file-utils
          dnf clean all

      - name: Check out source
        uses: actions/checkout@v4

      - name: Report Fedora toolchain
        run: |
          python3 --version
          rpm --version
          python3 -c "from PyQt5 import QtCore; print('Qt', QtCore.QT_VERSION_STR, 'PyQt', QtCore.PYQT_VERSION_STR)"
          command -v pyrcc5

      - name: Build application and native extensions
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 build.py

      - name: Run regression tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 -m pytest -q core hscommon

      - name: Validate GNOME desktop entry
        run: desktop-file-validate pkg/dupeguru.desktop

      - name: Build Fedora RPM
        run: |
          set -eux
          VERSION="$(python3 -c 'from core import __version__; print(__version__)')"
          mkdir -p "$PWD/rpmbuild"/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git archive --format=tar.gz --prefix="dupeguru-$VERSION/" HEAD > "rpmbuild/SOURCES/dupeguru-$VERSION.tar.gz"
          rpmbuild -bb --define "_topdir $PWD/rpmbuild" pkg/rpm/dupeguru.spec

      - name: Upload Fedora RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: dupeguru-fedora44-x86_64-rpm
          path: rpmbuild/RPMS/x86_64/dupeguru-[0-9]*.rpm
          if-no-files-found: error
          retention-days: 30

      - name: Install and inspect the built RPM
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -eux
          RPM="$(find rpmbuild/RPMS -type f -name 'dupeguru-[0-9]*.rpm' -print -quit)"
          test -n "$RPM"
          rpm -qpl "$RPM"
          dnf -y install "$RPM"
          desktop-file-validate /usr/share/applications/dupeguru.desktop
          test -x /usr/bin/dupeguru
          test -f /usr/libexec/dupeguru/qt/dg_rc.py
          test -f /usr/share/icons/hicolor/128x128/apps/dupeguru.png
          python3 -c "import sys; sys.path.insert(0, '/usr/libexec/dupeguru'); import core, hscommon, qt.dg_rc; print('Installed application modules import successfully')"

      - name: Smoke-test installed GUI startup
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set +e
          timeout --signal=TERM --kill-after=5s 15s /usr/bin/dupeguru > /tmp/dupeguru-launch.log 2>&1
          status=$?
          set -e
          cat /tmp/dupeguru-launch.log
          if [ "$status" -ne 124 ]; then
            echo "Expected the GUI event loop to remain alive until timeout; exit status was $status."
            exit 1
          fi
          echo "GUI process stayed alive for 15 seconds in Qt offscreen mode."

      - name: Remove RPM and verify launcher cleanup
        run: |
          set -eux
          dnf -y remove dupeguru
          test ! -e /usr/bin/dupeguru
