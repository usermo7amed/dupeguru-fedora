name: Fedora 44 build

on:
  push:
    branches:
      - master
      - fedora44-ci-packaging
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    steps:
      - name: Install system build dependencies
        run: |
          dnf -y upgrade --refresh
          dnf -y install \
            git make gcc gcc-c++ python3 python3-devel python3-pip \
            python3-qt5 python3-qt5-devel qt5-qttools-devel \
            gettext
          dnf clean all

      - name: Check out source
        uses: actions/checkout@v4

      - name: Create build environment
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install --upgrade pip setuptools wheel
          .venv/bin/python -m pip install -r requirements.txt -r requirements-extra.txt

      - name: Report toolchain
        run: |
          python3 --version
          .venv/bin/python -m pip --version
          .venv/bin/python -c "from PyQt5 import QtCore; print('Qt', QtCore.QT_VERSION_STR, 'PyQt', QtCore.PYQT_VERSION_STR)"
          command -v pyrcc5

      - name: Build native extensions
        run: .venv/bin/python build.py --modules

      - name: Build Qt resources
        run: |
          pyrcc5 qt/dg.qrc > qt/dg_rc.py
          .venv/bin/python -c "import qt.dg_rc"

      - name: Build translations
        run: .venv/bin/python build.py --loc

      - name: Run test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: .venv/bin/python -m pytest -q core hscommon

      - name: Build application and help
        env:
          QT_QPA_PLATFORM: offscreen
        run: .venv/bin/python build.py
